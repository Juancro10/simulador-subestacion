<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="author" content="Juan José Munera">
<title>Simulador de Seguridad Eléctrica – Acceso</title>
<style>
  /* Pantalla de acceso: el simulador está cifrado y solo se descifra con usuario y clave */
  :root{ --fondo:#0e1013; --panel:#171b20; --borde:#2a3038; --texto:#e8ecef; --tenue:#8a939c; --amarillo:#f5c400; --rojo:#ff4d3d; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--fondo); color:var(--texto); font-family:'Segoe UI', Roboto, Arial, sans-serif; }
  .panel{ width:100%; max-width:400px; background:var(--panel); border:1px solid var(--borde); border-radius:8px; overflow:hidden; }
  .franja{ height:10px; background:repeating-linear-gradient(-45deg, var(--amarillo) 0 14px, #111 14px 28px); }
  .cuerpo{ padding:28px 28px 24px; }
  h1{ margin:0 0 4px; font-size:22px; letter-spacing:.04em; }
  h1 span{ color:var(--amarillo); }
  p{ margin:0 0 20px; color:var(--tenue); font-size:14px; }
  label{ display:block; font-size:12px; letter-spacing:.12em; color:var(--tenue); margin:14px 0 6px; }
  input{ width:100%; padding:11px 12px; font-size:16px; color:var(--texto); background:#0f1216; border:1px solid var(--borde); border-radius:4px; }
  input:focus{ outline:none; border-color:var(--amarillo); }
  button{ width:100%; margin-top:22px; padding:12px; font-size:15px; font-weight:700; letter-spacing:.08em; cursor:pointer;
    color:#111; background:var(--amarillo); border:0; border-radius:4px; }
  button:disabled{ opacity:.6; cursor:wait; }
  .error{ min-height:20px; margin-top:14px; color:var(--rojo); font-size:14px; }
  .recordar{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:14px; color:var(--tenue); }
  .recordar input{ width:auto; }
  .autor{ margin-top:18px; padding-top:14px; border-top:1px solid var(--borde); font-size:13px; color:var(--tenue); text-align:center; }
</style>
</head>
<body>
<form class="panel" id="formulario" autocomplete="on">
  <div class="franja"></div>
  <div class="cuerpo">
    <h1>⚡ SIMULADOR DE <span>SEGURIDAD ELÉCTRICA</span></h1>
    <p>Acceso restringido. Ingresa el usuario y la clave entregados por el instructor.</p>
    <label for="usuario">USUARIO</label>
    <input id="usuario" name="username" autocomplete="username" required>
    <label for="clave">CLAVE</label>
    <input id="clave" name="password" type="password" autocomplete="current-password" required>
    <label class="recordar"><input type="checkbox" id="recordar"> No volver a pedirla en esta pestaña</label>
    <button id="entrar" type="submit">INGRESAR</button>
    <div class="error" id="error"></div>
    <div class="autor">Desarrollado por Juan José Munera<br>Maestría en Automatización Industrial</div>
  </div>
</form>

async function derivarLlave(usuario, clave){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(usuario.trim().toLowerCase() + '\n' + clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt:b64(PAQUETE.s), iterations:PAQUETE.n },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
// Descifra el simulador y lo carga en lugar de esta pantalla
async function abrir(llave){
  const datos = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(PAQUETE.i) }, llave, b64(PAQUETE.d));
  const html = new TextDecoder().decode(datos);
  document.open(); document.write(html); document.close();
}
// Si ya se ingresó en esta pestaña, se reutiliza la llave guardada en la sesión
(async () => {
  try {
    const guardada = sessionStorage.getItem(CLAVE_SESION);
    if (guardada){ await abrir(await crypto.subtle.importKey('raw', b64(guardada), 'AES-GCM', false, ['decrypt'])); }
  } catch(e) { try { sessionStorage.removeItem(CLAVE_SESION); } catch(_) {} }
})();
document.getElementById('formulario').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('entrar'), err = document.getElementById('error');
  btn.disabled = true; btn.textContent = 'VERIFICANDO…'; err.textContent = '';
  try {
    const llave = await derivarLlave(document.getElementById('usuario').value, document.getElementById('clave').value);
    if (document.getElementById('recordar').checked){
      try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', llave)); sessionStorage.setItem(CLAVE_SESION, btoa(String.fromCharCode(...raw))); } catch(_) {}
    }
    await abrir(llave);
  } catch(ex){
    err.textContent = 'Usuario o clave incorrectos.';
    btn.disabled = false; btn.textContent = 'INGRESAR';
  }
});
